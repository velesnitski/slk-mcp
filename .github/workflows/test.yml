name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref so a fast push doesn't keep
# the old job alive.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` so we see both Go versions even if one breaks
      # — knowing which version regressed is half the diagnosis.
      fail-fast: false
      matrix:
        # 1.23 is the floor (mcp-go requirement); newer is the moving
        # target. Bump the upper bound on each new stable release.
        go: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        # -race catches data races in the channel/user caches and the
        # parallel digest fan-out. Modest performance cost, high
        # confidence payoff.
        run: go test -race -count=1 ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # The config lives at .golangci.yml — only the selective rules
          # we trust to block CI on are enabled there.
          args: --timeout=5m

  sweep:
    name: Sweep (sensitive data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan reads every blob and commit message, so the
          # default shallow clone would silently cover almost nothing.
          fetch-depth: 0

      - name: Restore deny-list
        # The deny-list is untracked by design (ADR 076), so CI only has it
        # when the secret is set. Without it the job runs the shapes-only
        # scan and SAYS SO, rather than claiming coverage it does not have.
        env:
          SWEEP_PATTERNS: ${{ secrets.SWEEP_PATTERNS }}
        run: |
          if [ -n "$SWEEP_PATTERNS" ]; then
            printf '%s\n' "$SWEEP_PATTERNS" > .sweep-patterns.local
            echo "SWEEP_ARGS=--history --quiet" >> "$GITHUB_ENV"
          else
            echo "::notice::SWEEP_PATTERNS secret not set — running credential shapes only"
            echo "SWEEP_ARGS=--shapes-only --history --quiet" >> "$GITHUB_ENV"
          fi

      - name: Sweep
        # --quiet is not optional here: this repo is public, so its Actions
        # logs are public too. Printing a matched line would publish the
        # exact string the guard exists to keep out, into a log that no
        # history rewrite can ever reach.
        run: ./scripts/sweep.sh $SWEEP_ARGS
