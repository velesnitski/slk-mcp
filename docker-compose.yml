services:
  slack-mcp:
    image: velesnitski/slk-mcp
    ports:
      - "8001:8000"
    environment:
      - SLACK_TOKEN=xoxb-your-bot-token
      - SLACK_CHANNELS=general,announcements
      # Optional:
      # - SLACK_READ_ONLY=true
      # - SLACK_DIGEST_HOURS=24
      # - DISABLED_TOOLS=post_message,add_reaction
    restart: unless-stopped
