services:
  slack-mcp:
    image: velesnitski/slk-mcp
    ports:
      - "8001:8000"
    environment:
      - SLACK_USER_TOKEN=xoxp-your-user-token
      # Optional:
      # - SLACK_READ_ONLY=true
      # - SLACK_DIGEST_HOURS=24
      # - DISABLED_TOOLS=post_message,add_reaction
    restart: unless-stopped
